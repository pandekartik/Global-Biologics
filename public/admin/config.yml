backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: public/uploads
public_folder: /uploads

publish_mode: editorial_workflow

collections:
  - name: site
    label: Site
    files:
      - name: home
        label: Home Page
        file: content/pages/home.json
        format: json
        fields:
          - { label: Slug, name: slug, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}}: {{fields.heading}}{{fields.title}}"
            fields:
              - label: Type
                name: type
                widget: select
                options: ["hero", "what-we-do", "vision-mission", "challenge-approach", "why-us", "solutions-tabs", "innovation", "founders", "final-cta", "feature-grid", "solution-grid", "product-grid", "testimonial-band", "team-strip", "cta-band", "copy"]
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Vision Eyebrow, name: visionEyebrow, widget: string, required: false }
              - { label: Vision Title, name: visionTitle, widget: text, required: false }
              - { label: Mission Eyebrow, name: missionEyebrow, widget: string, required: false }
              - { label: Challenge Intro, name: challengeIntro, widget: text, required: false }
              - { label: Approach Intro, name: approachIntro, widget: text, required: false }
              - label: Primary CTA
                name: primaryCta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }
              - label: Secondary CTA
                name: secondaryCta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }
              - { label: Highlight, name: highlight, widget: text, required: false }
              - label: Cards
                name: cards
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: text }
              - label: Challenges
                name: challenges
                widget: list
                required: false
                fields:
                  - { label: Number, name: number, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: text }
              - label: Approaches
                name: approaches
                widget: list
                required: false
                fields:
                  - { label: Number, name: number, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: text }
              - label: Missions
                name: missions
                widget: list
                required: false
                field: { label: Mission, name: mission, widget: string }
              - label: Tabs
                name: tabs
                widget: list
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: text }
                  - label: Bullets
                    name: bullets
                    widget: list
                    field: { label: Bullet, name: bullet, widget: string }
              - label: Members
                name: members
                widget: list
                required: false
                fields:
                  - { label: Initials, name: initials, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Summary, name: summary, widget: text }
              - label: Tags
                name: tags
                widget: list
                required: false
                field: { label: Tag, name: tag, widget: string }
              - label: Items
                name: items
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: text }
                  - { label: Tag, name: tag, widget: string, required: false }
              - label: Product Slugs
                name: productSlugs
                widget: list
                required: false
                field: { label: Product Slug, name: slug, widget: string }
              - label: Solution Slugs
                name: solutionSlugs
                widget: list
                required: false
                field: { label: Solution Slug, name: slug, widget: string }
              - label: Testimonial Slugs
                name: testimonialSlugs
                widget: list
                required: false
                field: { label: Testimonial Slug, name: slug, widget: string }
              - label: Team Slugs
                name: teamSlugs
                widget: list
                required: false
                field: { label: Team Slug, name: slug, widget: string }
      - name: ortho
        label: Ortho Page
        file: content/pages/ortho.json
        format: json
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - { label: Hero Image, name: heroImage, widget: image, required: false }
              - { label: Logo Image, name: logoImage, widget: image, required: false }
          - label: Approach
            name: approach
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Intro Text, name: intro, widget: text }
              - label: Stats
                name: stats
                widget: list
                field: { label: Stat, name: text, widget: string }
          - label: Features
            name: features
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: text }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Stat, name: stat, widget: string }
                  - { label: Label, name: label, widget: string }
          - label: Challenge Section
            name: challenge
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Challenge Intro, name: challengeIntro, widget: text }
              - label: Challenges
                name: challenges
                widget: list
                field: { label: Challenge, name: text, widget: string }
              - { label: Approach Intro, name: approachIntro, widget: text }
              - label: Approaches
                name: approaches
                widget: list
                field: { label: Approach, name: text, widget: string }
          - label: Vision
            name: vision
            widget: object
            fields:
              - { label: Title, name: title, widget: text }
          - label: Mission
            name: mission
            widget: object
            fields:
              - label: Items
                name: items
                widget: list
                field: { label: Item, name: text, widget: string }
          - label: Product Section
            name: productSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Product Slugs
                name: productSlugs
                widget: list
                field: { label: Slug, name: slug, widget: string }
          - label: Why Different
            name: whyDifferent
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: Testimonials Section
            name: testimonials
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Testimonial Slugs
                name: testimonialSlugs
                widget: list
                field: { label: Slug, name: slug, widget: string }
              - label: Video Slugs
                name: videoSlugs
                widget: list
                field: { label: Slug, name: slug, widget: string }
      - name: bedsore
        label: Bedsore Page
        file: content/pages/bedsore.json
        format: json
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
              - { label: Hero Image, name: heroImage, widget: image, required: false }
              - { label: Logo Image, name: logoImage, widget: image, required: false }
          - label: Intro
            name: intro
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Text, name: text, widget: text }
          - label: Scenarios
            name: scenarios
            widget: list
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Stat, name: stat, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: At Risk Section
            name: atRisk
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: text }
              - { label: Subheading, name: subheading, widget: string }
              - label: Patients
                name: patients
                widget: list
                field: { label: Patient Type, name: text, widget: string }
              - label: Reasons
                name: reasons
                widget: list
                field: { label: Reason, name: text, widget: text }
          - label: Gap vs Need
            name: gapVsNeed
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Gap Intro, name: gapIntro, widget: text }
              - label: Gaps
                name: gaps
                widget: list
                field: { label: Gap, name: text, widget: string }
              - { label: Need Intro, name: needIntro, widget: text }
              - label: Needs
                name: needs
                widget: list
                field: { label: Need, name: text, widget: string }
          - label: Product Section
            name: productSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Product Slugs
                name: productSlugs
                widget: list
                field: { label: Slug, name: slug, widget: string }
          - label: Care Instructions
            name: careInstructions
            widget: object
            fields:
              - label: Steps
                name: steps
                widget: list
                field: { label: Step, name: text, widget: string }
              - { label: Note Title, name: noteTitle, widget: string }
              - { label: Note Text, name: noteText, widget: text }
              - { label: Daily Frequency, name: dailyFrequency, widget: string }
              - { label: Initial Course, name: initialCourse, widget: string }
          - label: Product Routine
            name: productRoutine
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - label: Steps
                name: steps
                widget: list
                field: { label: Step, name: text, widget: string }
          - label: Why Different
            name: whyDifferent
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: Testimonials Section
            name: testimonials
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Testimonial Slugs
                name: testimonialSlugs
                widget: list
                field: { label: Slug, name: slug, widget: string }
              - label: Video Slugs
                name: videoSlugs
                widget: list
                field: { label: Slug, name: slug, widget: string }

  - name: products
    label: Products
    folder: content/products
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: string }
      - { label: Brand, name: brand, widget: string, required: false }
      - { label: Volume, name: volume, widget: string, required: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Description, name: description, widget: text }
      - { label: Composition, name: composition, widget: text, required: false }
      - { label: Usage, name: usage, widget: text, required: false }
      - { label: Price, name: price, widget: string, required: false }
      - { label: Strike Price, name: strikePrice, widget: string, required: false }
      - { label: Badge, name: badge, widget: string, required: false }
      - { label: CTA Label, name: ctaLabel, widget: string, required: false }
      - { label: CTA Href, name: ctaHref, widget: string, required: false }
      - { label: Main Image, name: image, widget: image, required: false }
      - label: Thumbnails
        name: thumbnails
        widget: list
        required: false
        field: { label: Thumbnail, name: thumbnail, widget: image }
      - label: Benefits
        name: benefits
        widget: list
        field: { label: Benefit, name: benefit, widget: string }
      - label: Conditions
        name: conditions
        widget: list
        field: { label: Condition, name: condition, widget: string }
      - { label: Featured, name: featured, widget: boolean, required: false, default: false }
  - name: solutions
    label: Solutions
    folder: content/solutions
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Label, name: label, widget: string, required: false }
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Description, name: description, widget: text }
      - { label: Icon, name: icon, widget: string, required: false }
      - label: Bullets
        name: bullets
        widget: list
        required: false
        field: { label: Bullet, name: text, widget: string }
      - { label: Featured, name: featured, widget: boolean, required: false, default: false }
  - name: team
    label: Team
    folder: content/team
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Bio, name: bio, widget: text }
      - { label: Avatar, name: avatar, widget: image, required: false }
  - name: testimonials
    label: Testimonials
    folder: content/testimonials
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Quote, name: quote, widget: text }
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Company, name: company, widget: string, required: false }
      - { label: Rating, name: rating, widget: number, required: false, default: 5, value_type: int, min: 1, max: 5 }
      - { label: Avatar, name: avatar, widget: image, required: false }
      - { label: Featured, name: featured, widget: boolean, required: false, default: false }
  - name: video_testimonials
    label: Video Testimonials
    folder: content/video-testimonials
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Cover Image, name: coverImage, widget: image }
      - { label: Video URL, name: videoUrl, widget: string, required: false }

  - name: solution_pages
    label: Solution Pages
    folder: content/pages/landing
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Nav Label, name: navLabel, widget: string, required: false, hint: "Text shown in navbar dropdown" }
      - { label: Nav Logo, name: navLogo, widget: image, required: false, hint: "Logo icon shown in navbar dropdown" }
      - label: Sections
        name: sections
        widget: list
        summary: "{{fields.type}}: {{fields.heading}}{{fields.title}}"
        fields:
          - label: Type
            name: type
            widget: select
            options: ["hero", "what-we-do", "vision-mission", "challenge-approach", "why-us", "solutions-tabs", "innovation", "founders", "final-cta", "feature-grid", "solution-grid", "product-grid", "testimonial-band", "team-strip", "cta-band", "copy"]
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Description, name: description, widget: text, required: false }
          - { label: Vision Eyebrow, name: visionEyebrow, widget: string, required: false }
          - { label: Vision Title, name: visionTitle, widget: text, required: false }
          - { label: Mission Eyebrow, name: missionEyebrow, widget: string, required: false }
          - { label: Challenge Intro, name: challengeIntro, widget: text, required: false }
          - { label: Approach Intro, name: approachIntro, widget: text, required: false }
          - label: Primary CTA
            name: primaryCta
            widget: object
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
          - label: Secondary CTA
            name: secondaryCta
            widget: object
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
          - { label: Highlight, name: highlight, widget: text, required: false }
          - label: Cards
            name: cards
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: Challenges
            name: challenges
            widget: list
            required: false
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: Approaches
            name: approaches
            widget: list
            required: false
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: Missions
            name: missions
            widget: list
            required: false
            field: { label: Mission, name: mission, widget: string }
          - label: Tabs
            name: tabs
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - label: Bullets
                name: bullets
                widget: list
                field: { label: Bullet, name: bullet, widget: string }
          - label: Members
            name: members
            widget: list
            required: false
            fields:
              - { label: Initials, name: initials, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: Tags
            name: tags
            widget: list
            required: false
            field: { label: Tag, name: tag, widget: string }
          - label: Items
            name: items
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Tag, name: tag, widget: string, required: false }
          - label: Product Slugs
            name: productSlugs
            widget: list
            required: false
            field: { label: Product Slug, name: slug, widget: string }
          - label: Solution Slugs
            name: solutionSlugs
            widget: list
            required: false
            field: { label: Solution Slug, name: slug, widget: string }
          - label: Testimonial Slugs
            name: testimonialSlugs
            widget: list
            required: false
            field: { label: Testimonial Slug, name: slug, widget: string }
          - label: Team Slugs
            name: teamSlugs
            widget: list
            required: false
            field: { label: Team Slug, name: slug, widget: string }
